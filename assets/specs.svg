<text x="300" y="66" font-size="15"><tspan fill="#39ff88" font-weight="bold">pgriz</tspan><tspan fill="#c9d4e3">@</tspan><tspan fill="#4cc9f0" font-weight="bold">earth</tspan></text><line x1="300" x2="408" y1="75" y2="75" stroke="#5f7189" stroke-dasharray="4 3"/><text class="ln" style="animation-delay:0.15s" y="92" font-size="13.5"><tspan x="300" fill="#ffb000" font-weight="bold">OS</tspan><tspan x="410" fill="#c9d4e3">Human v1.0 (heavily caffeinated)</tspan></text><text class="ln" style="animation-delay:0.23s" y="113" font-size="13.5"><tspan x="300" fill="#ffb000" font-weight="bold">Location</tspan><tspan x="410" fill="#c9d4e3">South Carolina, USA</tspan></text><text class="ln" style="animation-delay:0.31s" y="134" font-size="13.5"><tspan x="300" fill="#ffb000" font-weight="bold">Day job</tspan><tspan x="410" fill="#c9d4e3">Senior Manager @ Doeren Mayhew</tspan></text><text class="ln" style="animation-delay:0.39s" y="155" font-size="13.5"><tspan x="300" fill="#ffb000" font-weight="bold">Night job</tspan><tspan x="410" fill="#c9d4e3">tinkering until something breaks</tspan></text><text class="ln" style="animation-delay:0.47s" y="176" font-size="13.5"><tspan x="300" fill="#ffb000" font-weight="bold">Copilot</tspan><tspan x="410" fill="#c9d4e3">Claude Code — always on, never idle</tspan></text><text class="ln" style="animation-delay:0.55s" y="197" font-size="13.5"><tspan x="300" fill="#ffb000" font-weight="bold">Fleet</tspan><tspan x="410" fill="#c9d4e3">a few too many agents · a few too many GPUs</tspan></text><text class="ln" style="animation-delay:0.63s" y="218" font-size="13.5"><tspan x="300" fill="#ffb000" font-weight="bold">Langs</tspan><tspan x="410" fill="#c9d4e3">TypeScript · Python · SQL · Bash</tspan></text><text class="ln" style="animation-delay:0.71s" y="239" font-size="13.5"><tspan x="300" fill="#ffb000" font-weight="bold">Stack</tspan><tspan x="410" fill="#c9d4e3">Next.js · React · Node · Postgres · Tailwind</tspan></text><text class="ln" style="animation-delay:0.79s" y="260" font-size="13.5"><tspan x="300" fill="#ffb000" font-weight="bold">AI</tspan><tspan x="410" fill="#c9d4e3">Claude · local LLMs · ComfyUI · RAG · MCP</tspan></text><text class="ln" style="animation-delay:0.87s" y="281" font-size="13.5"><tspan x="300" fill="#ffb000" font-weight="bold">Hobbies</tspan><tspan x="410" fill="#c9d4e3">AI video · 3D · prediction markets</tspan></text><text class="ln" style="animation-delay:0.95s" y="302" font-size="13.5"><tspan x="300" fill="#ffb000" font-weight="bold">Motto</tspan><tspan x="410" fill="#c9d4e3">&quot;make it more over the top.&quot;</tspan></text><text class="ln" style="animation-delay:1.03s" y="323" font-size="13.5"><tspan x="300" fill="#ffb000" font-weight="bold">Uptime</tspan><tspan x="410" fill="#c9d4e3">9 years on GitHub (since 2017)</tspan></text><rect x="300" y="350" width="28" height="16" rx="2" fill="#ff4d6d"/><rect x="332" y="350" width="28" height="16" rx="2" fill="#ffb000"/><rect x="364" y="350" width="28" height="16" rx="2" fill="#39ff88"/><rect x="396" y="350" width="28" height="16" rx="2" fill="#4cc9f0"/><rect x="428" y="350" width="28" height="16" rx="2" fill="#c77dff"/><rect x="460" y="350" width="28" height="16" rx="2" fill="#e6edf3"/><rect x="492" y="350" width="28" height="16" rx="2" fill="#3b4a5e"/><rect x="524" y="350" width="28" height="16" rx="2" fill="#ff8fab"/>
