<style>
text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;}

.sweepband{animation:band 7s linear infinite}
@keyframes band{from{transform:translateY(0)}to{transform:translateY(500px)}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.vscan{animation:vscan 2.2s ease-in-out infinite alternate}
@keyframes vscan{from{transform:translateX(0)}to{transform:translateX(168px)}}
.eye{animation:pulse 1.6s ease-in-out infinite}
.ln{animation:ln .4s ease-out both}
@keyframes ln{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
