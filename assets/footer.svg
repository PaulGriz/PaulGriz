<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 74" width="850" height="74" role="img">
<style>
text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;}

.sweepband{animation:band 7s linear infinite}
@keyframes band{from{transform:translateY(0)}to{transform:translateY(194px)}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

